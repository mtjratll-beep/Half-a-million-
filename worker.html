<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة العامل - خدمة تغيير الزيت</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen text-slate-800">

    <!-- شاشة تسجيل دخول العامل -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl max-w-md w-full space-y-6">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-900">تسجيل دخول العامل</h2>
                <p class="text-sm text-slate-500 mt-1">أدخل رقم الجوال وكلمة المرور الخاصة بك</p>
            </div>
            <form id="worker-login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">رقم الجوال</label>
                    <input type="text" id="login-phone" required placeholder="05xxxxxxxx" class="w-full p-3 border rounded-xl bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" id="login-pass" required placeholder="كلمة المرور..." class="w-full p-3 border rounded-xl bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl transition shadow">دخول إلى لوحة العمل</button>
            </form>
        </div>
    </div>

    <!-- المحتوى الرئيسي للوحة العامل -->
    <div id="worker-dashboard" class="hidden flex flex-col h-screen overflow-hidden bg-gray-100">
        <header class="bg-slate-800 text-white p-4 shadow flex justify-between items-center shrink-0">
            <div>
                <h1 id="worker-title" class="text-lg md:text-xl font-bold text-amber-400">لوحة العامل</h1>
                <p class="text-xs text-slate-300">متابعة الطلبات الموجهة إليك لحظياً</p>
            </div>
            <button onclick="workerLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">تسجيل الخروج</button>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl mx-auto w-full">
            <!-- الطلبات الجديدة / الجارية -->
            <div class="space-y-4">
                <h3 class="text-base font-bold text-slate-800 border-b pb-2">الطلبات المسندة إليك:</h3>
                <div id="worker-orders-container" class="space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow text-center text-slate-400">جاري التحقق من الطلبات...</div>
                </div>
            </div>

            <!-- الطلبات المكتملة -->
            <div class="space-y-4 pt-4 border-t">
                <h3 class="text-base font-bold text-slate-800">سجل طلباتك المكتملة:</h3>
                <div id="worker-completed-container" class="space-y-3">
                    <div class="bg-white p-4 rounded-xl shadow text-center text-slate-400 text-sm">لا توجد طلبات مكتملة حتى الآن</div>
                </div>
            </div>
        </main>
    </div>

    <!-- كود الجافاسكريبت والربط السحابي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNgBpEMZ1WGQ9zkbJQDb9y6OJweFqWNpg",
            authDomain: "half-27475.firebaseapp.com",
            databaseURL: "https://half-27475-default-rtdb.firebaseio.com",
            projectId: "half-27475",
            storageBucket: "half-27475.firebasestorage.app",
            messagingSenderId: "270803082259",
            appId: "1:270803082259:web:eaa8ca526791b2280fb3e6",
            measurementId: "G-B31TSL4WN9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentWorkerName = sessionStorage.getItem("worker_name") || "";
        let cachedOrders = {};
        let isInitialLoad = true;
        let audioCtx = null;

        // تهيئة الصوت عند التفاعل لأول مرة
        function initAutoAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }
        window.addEventListener('pointerdown', initAutoAudio, { once: true });
        window.addEventListener('keydown', initAutoAudio, { once: true });

        // دالة إصدار النغمة التنبيهية المميزة للطلبات الجديدة
        function playAlertTone() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                [0, 0.25, 0.5].forEach((delay, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25 + (index * 130), now + delay); // نغمات متصاعدة
                    gain.gain.setValueAtTime(0.7, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.2);
                });
            } catch (e) {}
        }

        if (currentWorkerName) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('worker-dashboard').classList.remove('hidden');
            document.getElementById('worker-title').innerText = `لوحة العامل: ${currentWorkerName}`;
            startListeningOrders();
        }

        // تسجيل الدخول
        document.getElementById('worker-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            onValue(ref(db, 'workers'), (snapshot) => {
                const workers = snapshot.val() || {};
                let foundWorker = null;

                Object.values(workers).forEach(w => {
                    if (w.phone === phone && w.pass === pass) {
                        foundWorker = w.name;
                    }
                });

                if (foundWorker) {
                    sessionStorage.setItem("worker_name", foundWorker);
                    currentWorkerName = foundWorker;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('worker-dashboard').classList.remove('hidden');
                    document.getElementById('worker-title').innerText = `لوحة العامل: ${foundWorker}`;
                    startListeningOrders();
                } else {
                    alert("رقم الجوال أو كلمة المرور غير صحيحة!");
                }
            }, { onlyOnce: true });
        });

        window.workerLogout = function() {
            sessionStorage.removeItem("worker_name");
            location.reload();
        }

        function startListeningOrders() {
            onValue(ref(db, 'orders'), (snapshot) => {
                const data = snapshot.val() || {};
                
                // فحص ما إذا كان هناك طلب جديد مسند لهذا العامل بالتحديد لتشغيل النغمة
                if (!isInitialLoad) {
                    let hasNewAssignedOrder = false;
                    Object.entries(data).forEach(([id, o]) => {
                        const assignedTo = o.assignedWorkerName || o.assignedWorker || '';
                        if (assignedTo === currentWorkerName) {
                            // إذا لم يكن الطلب موجوداً في الكاش السابق أو حالته الأولى
                            if (!cachedOrders[id]) {
                                hasNewAssignedOrder = true;
                            }
                        }
                    });
                    if (hasNewAssignedOrder) {
                        playAlertTone();
                    }
                }

                cachedOrders = data;
                isInitialLoad = false;
                renderWorkerOrders(data);
            });
        }

        window.updateOrderStatus = function(orderId, newStatus) {
            const updates = { status: newStatus };
            const timeNow = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            
            if (newStatus === 'جاري التحرك للعميل') updates.timeMoving = timeNow;
            if (newStatus === 'تم الوصول للعميل') updates.timeArrived = timeNow;
            if (newStatus === 'تم الانتهاء') updates.timeFinished = timeNow;

            update(ref(db, `orders/${orderId}`), updates).then(() => {
                alert("تم تحديث حالة الطلب بنجاح.");
            });
        }

        // دالة حذف الطلب المكتمل للعامل
        window.deleteCompletedOrder = function(orderId) {
            if (confirm("هل تريد حذف هذا الطلب من سجلك؟")) {
                remove(ref(db, `orders/${orderId}`)).then(() => {
                    alert("تم الحذف بنجاح.");
                });
            }
        }

        function renderWorkerOrders(orders) {
            const activeContainer = document.getElementById('worker-orders-container');
            const completedContainer = document.getElementById('worker-completed-container');
            
            activeContainer.innerHTML = '';
            completedContainer.innerHTML = '';

            let activeCount = 0;
            let completedCount = 0;

            Object.entries(orders).forEach(([id, o]) => {
                const assignedTo = o.assignedWorkerName || o.assignedWorker || '';
                if (assignedTo !== currentWorkerName) return;

                const isFinished = o.status === 'تم الانتهاء' || o.status === 'Finished';
                const custName = o.customerName || o.custName || '';
                const carName = o.carName || '';
                const carPlate = o.carPlate || '';
                const location = o.location || o.custLocation || 'غير متوفر';

                if (!isFinished) {
                    activeCount++;
                    activeContainer.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow space-y-3 border-r-4 border-amber-500">
                            <div class="flex justify-between items-center">
                                <span class="font-mono text-xs font-bold text-blue-600">طلب #${id.slice(-5)}</span>
                                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded">${o.status}</span>
                            </div>
                            <div class="text-sm space-y-1 text-slate-700">
                                <p><strong>العميل:</strong> ${custName}</p>
                                <p><strong>السيارة:</strong> ${carName} (${carPlate})</p>
                                <p><strong>الموقع:</strong> ${location}</p>
                            </div>
                            <div class="flex flex-wrap gap-2 pt-2 border-t">
                                <button onclick="updateOrderStatus('${id}', 'جاري التحرك للعميل')" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg text-xs font-bold transition">🚗 تحركت</button>
                                <button onclick="updateOrderStatus('${id}', 'تم الوصول للعميل')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg text-xs font-bold transition">📍 وصلت</button>
                                <button onclick="updateOrderStatus('${id}', 'تم الانتهاء')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-xs font-bold transition">✅ إتمام</button>
                            </div>
                        </div>
                    `;
                } else {
                    completedCount++;
                    completedContainer.innerHTML += `
                        <div class="bg-white p-3 rounded-xl shadow flex justify-between items-center text-sm border">
                            <div>
                                <span class="font-bold text-slate-800">${custName}</span>
                                <span class="text-xs text-slate-500 mr-2">(${carName})</span>
                                <span class="block text-xs text-emerald-600 font-semibold mt-0.5">مكتمل</span>
                            </div>
                            <button onclick="deleteCompletedOrder('${id}')" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition shadow">🗑️ حذف</button>
                        </div>
                    `;
                }
            });

            if (activeCount === 0) {
                activeContainer.innerHTML = `<div class="bg-white p-4 rounded-xl shadow text-center text-slate-400 text-sm">لا توجد طلبات جارية مسندة إليك حالياً</div>`;
            }
            if (completedCount === 0) {
                completedContainer.innerHTML = `<div class="bg-white p-4 rounded-xl shadow text-center text-slate-400 text-sm">لا توجد طلبات مكتملة حتى الآن</div>`;
            }
        }
    </script>
</body>
</html>
